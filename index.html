<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADPL Service Manager</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    h1, h2 { color: #333; }
    .container { max-width: 1000px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .section { margin-bottom: 30px; border-bottom: 1px solid #ddd; padding-bottom: 20px; }
    input, select, textarea, button { padding: 8px 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; display: block; width: 100%; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; width: auto; display: inline-block; }
    button:hover { background-color: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #fff; }
    .status-pending { background-color: #ffc107; color: #000; }
    .status-completed { background-color: #28a745; }
  </style>

  <!-- 1. Supabase Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
  <h1>Alliance Digitech Pvt. Ltd. - Service Manager</h1>

  <!-- CUSTOMER SECTION -->
  <div class="section">
    <h2>1. Customer Management</h2>
    <form id="customerForm">
      <input type="text" id="custName" placeholder="Customer Name" required>
      <input type="text" id="custContact" placeholder="Contact Number" required>
      <input type="email" id="custEmail" placeholder="Email Address">
      <textarea id="custMachines" placeholder='Machines (JSON format e.g. [{"name":"Model X","sn":"123"}])'></textarea>
      <button type="submit">Add Customer</button>
    </form>

    <h3>Customer List</h3>
    <table id="customerTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Contact</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- SERVICE REPORT SECTION -->
  <div class="section">
    <h2>2. Service Reports</h2>
    <form id="reportForm">
      <input type="text" id="scnNo" placeholder="SCN No" required>
      <input type="text" id="reportCustomer" placeholder="Customer Name" required>
      <input type="date" id="serviceDate" required>
      <input type="text" id="machine" placeholder="Machine Name">
      <input type="text" id="engineer" placeholder="Engineer Name">
      <textarea id="complaint" placeholder="Complaint Details"></textarea>
      <textarea id="workDone" placeholder="Work Done Details"></textarea>
      <button type="submit">Save Service Report</button>
    </form>

    <h3>Service Reports List</h3>
    <table id="reportTable">
      <thead>
        <tr>
          <th>SCN No</th>
          <th>Customer</th>
          <th>Date</th>
          <th>Machine</th>
          <th>Engineer</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- STOCK INVENTORY SECTION -->
  <div class="section">
    <h2>3. Stock Inventory</h2>
    <form id="stockForm">
      <input type="text" id="partName" placeholder="Part Name" required>
      <input type="text" id="partCode" placeholder="Part Code">
      <input type="number" id="partQty" placeholder="Quantity" value="0" required>
      <input type="number" id="minStock" placeholder="Minimum Stock" value="0">
      <button type="submit">Add / Update Part</button>
    </form>

    <h3>Current Stock</h3>
    <table id="stockTable">
      <thead>
        <tr>
          <th>Part Name</th>
          <th>Part Code</th>
          <th>Quantity</th>
          <th>Min Stock</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  // 2. Supabase Configuration & Initialization
  const SUPABASE_URL = "https://xxjjszhbsyofzqxoqwrd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_b2Fw1PCsg6qGWTviBrBFLQ_ZiNOUGoL";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Initial Load
  window.addEventListener('DOMContentLoaded', () => {
    loadCustomers();
    loadReports();
    loadStock();
  });

  // ==================== CUSTOMERS ====================
  async function loadCustomers() {
    const { data, error } = await supabase.from('customers').select('*').order('id', { ascending: false });
    if (error) { console.error('Error loading customers:', error); return; }
    
    const tbody = document.querySelector('#customerTable tbody');
    tbody.innerHTML = '';
    data.forEach(c => {
      tbody.innerHTML += `
        <tr>
          <td>${c.id}</td>
          <td>${c.name || '-'}</td>
          <td>${c.contact || '-'}</td>
          <td>${c.email || '-'}</td>
        </tr>`;
    });
  }

  document.getElementById('customerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    let machinesArr = [];
    try {
      const val = document.getElementById('custMachines').value;
      if (val) machinesArr = JSON.parse(val);
    } catch(err) {
      alert("Machines JSON Invalid format!");
      return;
    }

    const newCustomer = {
      name: document.getElementById('custName').value,
      contact: document.getElementById('custContact').value,
      email: document.getElementById('custEmail').value,
      machines: machinesArr
    };

    const { error } = await supabase.from('customers').insert([newCustomer]);
    if (error) {
      alert('Error adding customer: ' + error.message);
    } else {
      alert('Customer added successfully!');
      document.getElementById('customerForm').reset();
      loadCustomers();
    }
  });

  // ==================== SERVICE REPORTS ====================
  async function loadReports() {
    const { data, error } = await supabase.from('service_reports').select('*').order('id', { ascending: false });
    if (error) { console.error('Error loading reports:', error); return; }

    const tbody = document.querySelector('#reportTable tbody');
    tbody.innerHTML = '';
    data.forEach(r => {
      tbody.innerHTML += `
        <tr>
          <td>${r.scn_no || '-'}</td>
          <td>${r.customer || '-'}</td>
          <td>${r.service_date || '-'}</td>
          <td>${r.machine || '-'}</td>
          <td>${r.engineer || '-'}</td>
          <td><span class="status-badge status-pending">${r.status || 'Pending'}</span></td>
        </tr>`;
    });
  }

  document.getElementById('reportForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newReport = {
      scn_no: document.getElementById('scnNo').value,
      customer: document.getElementById('reportCustomer').value,
      service_date: document.getElementById('serviceDate').value,
      machine: document.getElementById('machine').value,
      engineer: document.getElementById('engineer').value,
      complaint: document.getElementById('complaint').value,
      work_done: document.getElementById('workDone').value
    };

    const { error } = await supabase.from('service_reports').insert([newReport]);
    if (error) {
      alert('Error saving service report: ' + error.message);
    } else {
      alert('Service Report saved successfully!');
      document.getElementById('reportForm').reset();
      loadReports();
    }
  });

  // ==================== STOCK PARTS ====================
  async function loadStock() {
    const { data, error } = await supabase.from('stock_parts').select('*').order('id', { ascending: false });
    if (error) { console.error('Error loading stock:', error); return; }

    const tbody = document.querySelector('#stockTable tbody');
    tbody.innerHTML = '';
    data.forEach(s => {
      tbody.innerHTML += `
        <tr>
          <td>${s.part_name || '-'}</td>
          <td>${s.part_code || '-'}</td>
          <td>${s.quantity}</td>
          <td>${s.minimum_stock}</td>
        </tr>`;
    });
  }

  document.getElementById('stockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPart = {
      part_name: document.getElementById('partName').value,
      part_code: document.getElementById('partCode').value,
      quantity: parseFloat(document.getElementById('partQty').value) || 0,
      minimum_stock: parseFloat(document.getElementById('minStock').value) || 0
    };

    const { error } = await supabase.from('stock_parts').insert([newPart]);
    if (error) {
      alert('Error saving stock part: ' + error.message);
    } else {
      alert('Stock Part saved successfully!');
      document.getElementById('stockForm').reset();
      loadStock();
    }
  });
</script>

</body>
</html>
